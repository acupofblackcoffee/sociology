<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Sociology Chronicle</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="page-article">

    <!-- 記事ページにもヘッダーを追加 -->
    <header class="app-header sticky-header">
        <div class="header-left">
            <button id="menu-toggle" class="menu-btn" aria-label="Menu">
                <span class="menu-icon"></span>
            </button>
            <!-- パンくずリストをヘッダー内に配置 -->
            <nav id="breadcrumbs" class="breadcrumbs"></nav>
        </div>
    </header>

    <!-- 記事ページでもサイドバーを使えるように配置 -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-inner">
            <div class="sidebar-header-area">
                <h2 class="site-title-small">Sociology Chronicle</h2>
            </div>
            <!-- ここにフィルタ等は表示せず、シンプルなナビゲーションにするか、
                 indexと同じフィルタを表示して、クリックしたらindexに戻る仕様にします -->
            <div class="sidebar-content">
                 <p style="padding: 1rem; color: #666; font-size: 0.9rem;">
                     フィルタリング機能はトップページで使用できます。
                 </p>
                 <a href="index.html" class="btn-reset" style="text-align:center; text-decoration:none; display:block;">トップページへ戻る</a>
            </div>
        </div>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <main class="container">
        <!-- 記事本文エリア -->
        <article id="article-content" class="article-body">
            <div class="loading">Loading Article...</div>
        </article>

        <!-- 文献リスト -->
        <section id="references-area" class="references-section" style="display:none;">
            <h3>References</h3>
            <ul id="references-list"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
