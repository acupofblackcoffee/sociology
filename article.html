<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article View - Sociology Chronicle</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Marked.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="page-article">

    <header class="article-header">
        <div class="container">
            <a href="index.html" class="back-link">← Back to Chronicle</a>
        </div>
    </header>

    <main class="container">
        <!-- 記事メタデータ -->
        <div id="article-meta" class="article-meta"></div>

        <!-- 記事本文 (Markdownがここに展開されます) -->
        <article id="article-content" class="article-body">
            <div class="loading">Loading Article...</div>
        </article>

        <!-- 文献リスト -->
        <section id="references-area" class="references-section" style="display:none;">
            <h3>References</h3>
            <ul id="references-list"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
