<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sociology Chronicle</title>
    <!-- バージョン02のCSSを読み込み -->
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="page-index">

    <!-- ハンバーガーボタン (常に表示) -->
    <button id="menu-toggle" class="menu-toggle" aria-label="Toggle Menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </button>

    <div class="layout-container">
        <!-- サイドバー：フィルタリング -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h1 class="site-title">Sociology Chronicle</h1>
                <p class="site-subtitle">The Archive of Sociological Debates</p>
            </div>

            <div class="sidebar-content">
                <!-- フィルタ群 (JSでアコーディオン生成) -->
                <div class="filter-group">
                    <details open>
                        <summary>年代 (Era)</summary>
                        <div id="filter-eras" class="checkbox-list"></div>
                    </details>
                </div>

                <div class="filter-group">
                    <details>
                        <summary>国家 (Country)</summary>
                        <div id="filter-countries" class="checkbox-list"></div>
                    </details>
                </div>

                <!-- 新設: 分野 -->
                <div class="filter-group">
                    <details>
                        <summary>分野 (Field)</summary>
                        <div id="filter-fields" class="checkbox-list"></div>
                    </details>
                </div>

                <div class="filter-group">
                    <details>
                        <summary>論点 (Topic)</summary>
                        <div id="filter-topics" class="checkbox-list"></div>
                    </details>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <button id="reset-filters" class="btn-reset">Reset Filters</button>
            </div>
        </aside>z

        <!-- サイドバーが開いた時の背景黒幕 -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- メインエリア：タイムライン -->
        <main class="main-content">
            <div id="active-filters" class="active-filters-bar">
                <!-- 選択中のフィルタ表示エリア -->
            </div>
            <div id="timeline-grid" class="timeline-grid">
                <!-- JSでカード生成 -->
            </div>
        </main>
    </div>

    <!-- バージョン02のJSを読み込み -->
    <script src="app.js"></script>
</body>
</html>
