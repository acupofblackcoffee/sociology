<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sociology Chronicle</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="page-index">

    <!-- ヘッダーバー (Gemini/GitHub風) -->
    <header class="app-header">
        <button id="menu-toggle" class="menu-btn" aria-label="Menu">
            <span class="menu-icon"></span>
        </button>
        <h1 class="header-title">Sociology Chronicle</h1>
    </header>

    <div class="layout-container">
        <!-- サイドバー (ドロワーメニュー) -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-inner">
                <div class="sidebar-header-area">
                    <p class="site-subtitle">The Archive of Sociological Debates</p>
                </div>

                <div class="sidebar-content">
                    <div class="filter-group">
                        <details open>
                            <summary>年代 (Era)</summary>
                            <div id="filter-eras" class="checkbox-list"></div>
                        </details>
                    </div>

                    <div class="filter-group">
                        <details>
                            <summary>国家 (Country)</summary>
                            <div id="filter-countries" class="checkbox-list"></div>
                        </details>
                    </div>

                    <div class="filter-group">
                        <details>
                            <summary>分野 (Field)</summary>
                            <div id="filter-fields" class="checkbox-list"></div>
                        </details>
                    </div>

                    <div class="filter-group">
                        <details>
                            <summary>論点 (Topic)</summary>
                            <div id="filter-topics" class="checkbox-list"></div>
                        </details>
                    </div>
                </div>
                
                <div class="sidebar-footer">
                    <button id="reset-filters" class="btn-reset">Reset Filters</button>
                </div>
            </div>
        </aside>

        <!-- サイドバー背景の黒幕 -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- メインコンテンツ -->
        <main class="main-content">
            <div class="content-wrapper">
                <div id="active-filters" class="active-filters-bar"></div>
                <div id="timeline-grid" class="timeline-grid"></div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
