<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sociology Chronicle</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="page-index">

    <!-- 共通ヘッダーモジュール -->
    <header class="app-header">
        <div class="header-left">
            <button id="menu-toggle" class="menu-btn" aria-label="Menu">
                <span class="menu-icon"></span>
            </button>
            <h1 class="header-title"><a href="index.html">Sociology Chronicle</a></h1>
        </div>
        
        <!-- 右側固定パンくずリスト -->
        <div class="header-right">
            <nav id="breadcrumbs" class="breadcrumbs"></nav>
        </div>
    </header>

    <!-- 共通レイアウトコンテナ -->
    <div class="app-container">
        
        <!-- 共通サイドバーモジュール -->
        <aside class="sidebar">
            <div class="sidebar-inner">
                <div class="sidebar-header-area">
                    <p class="site-subtitle">The Archive of Sociological Debates</p>
                </div>
                
                <div class="sidebar-content">
                    <div id="sidebar-filters-mount">
                        <!-- JSでフィルタリストをここに生成 -->
                    </div>
                </div>

                <div class="sidebar-footer">
                    <button id="reset-filters" class="btn-reset">Reset Filters</button>
                </div>
            </div>
        </aside>

        <!-- メインコンテンツ -->
        <main class="main-content">
            <div id="active-filters" class="active-filters-bar"></div>
            <div id="timeline-grid" class="timeline-grid"></div>
        </main>

        <!-- スマホ用オーバーレイ -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
